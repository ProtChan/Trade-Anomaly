name: Update USDJPY H1 mid and deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  schedule:
    - cron: '20 8 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trade-anomaly-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'

      - name: Decide download range and whether to rebuild
        id: range
        shell: bash
        run: |
          TO=$(date -u +%F)
          IS_MID=false
          if [ -s data/usdjpy_h1.csv ] && [ -s data/meta.json ]; then
            IS_MID=$(python3 - <<'PY'
          import json
          try:
              with open('data/meta.json', encoding='utf-8') as f:
                  print('true' if json.load(f).get('price_type') == 'mid' else 'false')
          except Exception:
              print('false')
          PY
          )
          fi

          if [ "$IS_MID" = "true" ]; then
            FROM=$(python3 - <<'PY'
          import csv
          from datetime import datetime, timedelta, timezone
          last = None
          with open('data/usdjpy_h1.csv', newline='', encoding='utf-8') as f:
              for row in csv.DictReader(f):
                  try: last = int(float(row['timestamp']))
                  except Exception: pass
          if last is None:
              raise SystemExit(1)
          print((datetime.fromtimestamp(last/1000, tz=timezone.utc) - timedelta(days=7)).date().isoformat())
          PY
          )
            RESET=false
          else
            FROM=$(date -u -d '366 days ago' +%F)
            RESET=true
          fi

          echo "from=$FROM" >> "$GITHUB_OUTPUT"
          echo "to=$TO" >> "$GITHUB_OUTPUT"
          echo "reset=$RESET" >> "$GITHUB_OUTPUT"
          echo "USDJPY H1 full quote range: $FROM -> $TO, reset=$RESET"

      - name: Install Dukascopy full-quote downloader
        shell: bash
        run: |
          go install github.com/Nosvemos/dukascopy-go/cmd/dukascopy-go@latest
          dukascopy-go --version || true

      - name: Download Dukascopy full Bid+Ask H1 using datafeed engine
        shell: bash
        run: |
          rm -rf download
          mkdir -p download
          dukascopy-go download \
            --symbol USDJPY \
            --timeframe h1 \
            --from "${{ steps.range.outputs.from }}" \
            --to "${{ steps.range.outputs.to }}" \
            --output download/usdjpy_h1_full.csv \
            --engine datafeed \
            --full \
            --timezone UTC \
            --no-progress \
            --retries 5 \
            --retry-backoff 2s \
            --rate-limit 250ms
          echo "Full quote CSV header:"
          head -n 3 download/usdjpy_h1_full.csv
          test -s download/usdjpy_h1_full.csv

      - name: Build rolling midpoint H1 and validate
        shell: bash
        run: |
          RESET_ARG=""
          if [ "${{ steps.range.outputs.reset }}" = "true" ]; then RESET_ARG="--reset-existing"; fi
          python scripts/merge_data.py \
            --full-file download/usdjpy_h1_full.csv \
            --output data/usdjpy_h1.csv \
            --meta data/meta.json \
            $RESET_ARG
          python -m py_compile scripts/merge_data.py
          node --check app.js
          node --check pnl-chart-v3.js
          python3 - <<'PY'
          import csv, json
          with open('data/meta.json', encoding='utf-8') as f:
              meta = json.load(f)
          assert meta['price_type'] == 'mid', meta
          assert meta['bars'] >= 4000, meta
          with open('data/usdjpy_h1.csv', newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == meta['bars']
          assert all(float(rows[i]['open']) > 0 for i in range(min(20, len(rows))))
          print('validated midpoint bars:', len(rows))
          PY
          wc -l data/usdjpy_h1.csv
          cat data/meta.json

      - name: Commit refreshed mid data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/usdjpy_h1.csv data/meta.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh USDJPY H1 midpoint rolling year"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html styles.css app.js pnl-chart-v3.js _site/
          cp -R data _site/data
          touch _site/.nojekyll

      - name: Check or enable GitHub Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" "${headers[@]}" "$api")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          create_code=$(curl -sS -o /tmp/pages-create.json -w "%{http_code}" -X POST \
            "${headers[@]}" -H "Content-Type: application/json" \
            -d '{"build_type":"workflow"}' "$api")
          if [ "$create_code" = "201" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi

      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
