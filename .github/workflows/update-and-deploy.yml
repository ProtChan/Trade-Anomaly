name: Update USDJPY H1 mid and deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  schedule:
    - cron: '20 8 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trade-anomaly-mid-v5
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set rolling-year and recent tick ranges
        id: range
        shell: bash
        run: |
          TO=$(date -u +%F)
          FROM=$(date -u -d '366 days ago' +%F)
          TICK_FROM=$(date -u -d '7 days ago' +%F)
          echo "from=$FROM" >> "$GITHUB_OUTPUT"
          echo "to=$TO" >> "$GITHUB_OUTPUT"
          echo "tick_from=$TICK_FROM" >> "$GITHUB_OUTPUT"
          echo "H1 baseline: $FROM -> $TO; raw tick midpoint refresh: $TICK_FROM -> $TO"

      - name: Install pinned Dukascopy downloader
        shell: bash
        run: |
          curl -fL --retry 4 --retry-delay 2 \
            https://github.com/Nosvemos/dukascopy-go/releases/download/v0.2.0/dukascopy-go_0.2.0_linux_amd64.tar.gz \
            -o /tmp/dukascopy-go.tgz
          mkdir -p /tmp/dukascopy-bin
          tar -xzf /tmp/dukascopy-go.tgz -C /tmp/dukascopy-bin
          BIN=$(find /tmp/dukascopy-bin -maxdepth 2 -type f -name 'dukascopy-go' -print -quit 2>/dev/null)
          test -n "$BIN"
          sudo install -m 0755 "$BIN" /usr/local/bin/dukascopy-go
          dukascopy-go --version || true

      - name: Download full Bid+Ask H1 baseline
        shell: bash
        run: |
          rm -rf download
          mkdir -p download
          dukascopy-go download \
            --symbol USDJPY \
            --timeframe h1 \
            --from "${{ steps.range.outputs.from }}" \
            --to "${{ steps.range.outputs.to }}" \
            --output download/usdjpy_h1_full.csv \
            --engine datafeed \
            --full \
            --timezone UTC \
            --no-progress \
            --retries 5 \
            --retry-backoff 2s \
            --rate-limit 250ms
          head -n 3 download/usdjpy_h1_full.csv
          test -s download/usdjpy_h1_full.csv

      - name: Download recent raw Bid+Ask ticks
        shell: bash
        run: |
          dukascopy-go download \
            --symbol USDJPY \
            --timeframe tick \
            --from "${{ steps.range.outputs.tick_from }}" \
            --to "${{ steps.range.outputs.to }}" \
            --output download/usdjpy_recent_ticks.csv \
            --engine datafeed \
            --simple \
            --timezone UTC \
            --no-progress \
            --retries 6 \
            --retry-backoff 2s \
            --rate-limit 100ms
          echo "Tick CSV preview:"
          head -n 3 download/usdjpy_recent_ticks.csv
          test -s download/usdjpy_recent_ticks.csv

      - name: Build clean rolling midpoint H1 and validate September coverage
        shell: bash
        run: |
          python scripts/merge_data.py \
            --full-file download/usdjpy_h1_full.csv \
            --tick-file download/usdjpy_recent_ticks.csv \
            --output data/usdjpy_h1.csv \
            --meta data/meta.json \
            --reset-existing
          python -m py_compile scripts/merge_data.py
          node --check app.js
          python3 - <<'PY'
          import csv, json
          from datetime import datetime, timezone
          with open('data/meta.json', encoding='utf-8') as f:
              meta = json.load(f)
          assert meta['price_type'] == 'mid', meta
          assert int(meta.get('dataset_version', 0)) >= 3, meta
          assert meta['bars'] >= 4000, meta
          assert int(meta.get('raw_ticks_loaded_this_run', 0)) > 0, meta
          sep1 = int(datetime(2026, 9, 1, tzinfo=timezone.utc).timestamp() * 1000)
          assert int(meta['last_timestamp']) >= sep1, meta
          with open('data/usdjpy_h1.csv', newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == meta['bars']
          assert any(int(float(r['timestamp'])) >= sep1 for r in rows), 'September rows missing'
          assert all(float(rows[i]['open']) > 0 for i in range(min(20, len(rows))))
          print('validated midpoint bars:', len(rows), 'last:', meta['last_utc'], 'ticks:', meta['raw_ticks_loaded_this_run'])
          PY
          wc -l data/usdjpy_h1.csv
          cat data/meta.json

      - name: Commit refreshed mid data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/usdjpy_h1.csv data/meta.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh USDJPY H1 midpoint with recent raw ticks"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html styles.css chart-html.css app.js _site/
          cp -R data _site/data
          touch _site/.nojekyll

      - name: Check or enable GitHub Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" "${headers[@]}" "$api")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          create_code=$(curl -sS -o /tmp/pages-create.json -w "%{http_code}" -X POST \
            "${headers[@]}" -H "Content-Type: application/json" \
            -d '{"build_type":"workflow"}' "$api")
          if [ "$create_code" = "201" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi

      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
