name: Update USDJPY H1 mid and deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  schedule:
    - cron: '20 8 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trade-anomaly-pages
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      from: ${{ steps.range.outputs.from }}
      to: ${{ steps.range.outputs.to }}
      reset: ${{ steps.range.outputs.reset }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide download range and whether to rebuild
        id: range
        shell: bash
        run: |
          TO=$(date -u +%F)
          IS_MID=false
          if [ -s data/usdjpy_h1.csv ] && [ -s data/meta.json ]; then
            IS_MID=$(python3 - <<'PY'
          import json
          try:
              with open('data/meta.json', encoding='utf-8') as f:
                  print('true' if json.load(f).get('price_type') == 'mid' else 'false')
          except Exception:
              print('false')
          PY
          )
          fi

          if [ "$IS_MID" = "true" ]; then
            FROM=$(python3 - <<'PY'
          import csv
          from datetime import datetime, timedelta, timezone
          last = None
          with open('data/usdjpy_h1.csv', newline='', encoding='utf-8') as f:
              for row in csv.DictReader(f):
                  try: last = int(float(row['timestamp']))
                  except Exception: pass
          if last is None:
              raise SystemExit(1)
          print((datetime.fromtimestamp(last/1000, tz=timezone.utc) - timedelta(days=7)).date().isoformat())
          PY
          )
            RESET=false
          else
            FROM=$(date -u -d '366 days ago' +%F)
            RESET=true
          fi
          echo "from=$FROM" >> "$GITHUB_OUTPUT"
          echo "to=$TO" >> "$GITHUB_OUTPUT"
          echo "reset=$RESET" >> "$GITHUB_OUTPUT"
          echo "range=$FROM..$TO reset=$RESET"

  download_bid:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download bid H1
        shell: bash
        run: |
          mkdir -p download/bid
          download() {
            npx --yes dukascopy-node@1.50.0 \
              -i usdjpy -from "${{ needs.plan.outputs.from }}" -to "${{ needs.plan.outputs.to }}" \
              -t h1 -p bid -v -f csv -dir download/bid \
              -bs 3 -bp 2000 -r 3 -rp 3000
          }
          if ! download; then
            echo "JSON API path failed; falling back to direct-datafeed engine 1.46.4"
            rm -rf download/bid && mkdir -p download/bid
            npx --yes dukascopy-node@1.46.4 \
              -i usdjpy -from "${{ needs.plan.outputs.from }}" -to "${{ needs.plan.outputs.to }}" \
              -t h1 -p bid -v -f csv -dir download/bid \
              -bs 3 -bp 2000 -r 3 -rp 3000
          fi
          test -n "$(find download/bid -name '*.csv' -type f -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: usdjpy-h1-bid
          path: download/bid/*.csv
          if-no-files-found: error
          retention-days: 1

  download_ask:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download ask H1
        shell: bash
        run: |
          mkdir -p download/ask
          download() {
            npx --yes dukascopy-node@1.50.0 \
              -i usdjpy -from "${{ needs.plan.outputs.from }}" -to "${{ needs.plan.outputs.to }}" \
              -t h1 -p ask -v -f csv -dir download/ask \
              -bs 3 -bp 2000 -r 3 -rp 3000
          }
          if ! download; then
            echo "JSON API path failed; falling back to direct-datafeed engine 1.46.4"
            rm -rf download/ask && mkdir -p download/ask
            npx --yes dukascopy-node@1.46.4 \
              -i usdjpy -from "${{ needs.plan.outputs.from }}" -to "${{ needs.plan.outputs.to }}" \
              -t h1 -p ask -v -f csv -dir download/ask \
              -bs 3 -bp 2000 -r 3 -rp 3000
          fi
          test -n "$(find download/ask -name '*.csv' -type f -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: usdjpy-h1-ask
          path: download/ask/*.csv
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [plan, download_bid, download_ask]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: usdjpy-h1-bid
          path: download/bid
      - uses: actions/download-artifact@v4
        with:
          name: usdjpy-h1-ask
          path: download/ask

      - name: Build matched H1 mid and validate
        shell: bash
        run: |
          RESET_ARG=""
          if [ "${{ needs.plan.outputs.reset }}" = "true" ]; then RESET_ARG="--reset-existing"; fi
          python scripts/merge_data.py \
            --bid-dir download/bid \
            --ask-dir download/ask \
            --output data/usdjpy_h1.csv \
            --meta data/meta.json \
            $RESET_ARG
          python -m py_compile scripts/merge_data.py
          node --check app.js
          node --check pnl-chart-v3.js
          wc -l data/usdjpy_h1.csv
          cat data/meta.json

      - name: Commit refreshed mid data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/usdjpy_h1.csv data/meta.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh USDJPY H1 mid rolling year"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html styles.css app.js pnl-chart-v3.js _site/
          cp -R data _site/data
          touch _site/.nojekyll

      - name: Check or enable GitHub Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" "${headers[@]}" "$api")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          create_code=$(curl -sS -o /tmp/pages-create.json -w "%{http_code}" -X POST \
            "${headers[@]}" -H "Content-Type: application/json" \
            -d '{"build_type":"workflow"}' "$api")
          if [ "$create_code" = "201" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi

      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
