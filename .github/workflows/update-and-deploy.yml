name: Update USDJPY long-history research and deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  schedule:
    - cron: '20 8 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trade-anomaly-mid-v7
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set ten-year H1 and recent M1 ranges
        id: range
        shell: bash
        run: |
          TO=$(date -u +%F)
          FROM=$(date -u -d '3651 days ago' +%F)
          RECENT_FROM=$(date -u -d '7 days ago' +%F)
          echo "from=$FROM" >> "$GITHUB_OUTPUT"
          echo "to=$TO" >> "$GITHUB_OUTPUT"
          echo "recent_from=$RECENT_FROM" >> "$GITHUB_OUTPUT"
          echo "H1 baseline: $FROM -> $TO; direct M1 midpoint refresh: $RECENT_FROM -> $TO"

      - name: Install pinned Dukascopy downloader
        shell: bash
        run: |
          curl -fL --retry 4 --retry-delay 2 \
            https://github.com/Nosvemos/dukascopy-go/releases/download/v0.2.0/dukascopy-go_0.2.0_linux_amd64.tar.gz \
            -o /tmp/dukascopy-go.tgz
          mkdir -p /tmp/dukascopy-bin
          tar -xzf /tmp/dukascopy-go.tgz -C /tmp/dukascopy-bin
          BIN=$(find /tmp/dukascopy-bin -maxdepth 2 -type f -name 'dukascopy-go' -print -quit 2>/dev/null)
          test -n "$BIN"
          sudo install -m 0755 "$BIN" /usr/local/bin/dukascopy-go
          dukascopy-go --version || true

      - name: Download full Bid+Ask H1 baseline
        shell: bash
        run: |
          rm -rf download
          mkdir -p download
          dukascopy-go download \
            --symbol USDJPY \
            --timeframe h1 \
            --from "${{ steps.range.outputs.from }}" \
            --to "${{ steps.range.outputs.to }}" \
            --output download/usdjpy_h1_full.csv \
            --engine datafeed \
            --full \
            --timezone UTC \
            --no-progress \
            --retries 5 \
            --retry-backoff 2s \
            --rate-limit 250ms
          head -n 3 download/usdjpy_h1_full.csv
          test -s download/usdjpy_h1_full.csv

      - name: Download recent direct Bid+Ask M1 quotes
        shell: bash
        run: |
          dukascopy-go download \
            --symbol USDJPY \
            --timeframe m1 \
            --from "${{ steps.range.outputs.recent_from }}" \
            --to "${{ steps.range.outputs.to }}" \
            --output download/usdjpy_recent_m1_full.csv \
            --engine datafeed \
            --full \
            --timezone UTC \
            --no-progress \
            --retries 6 \
            --retry-backoff 2s \
            --rate-limit 100ms
          echo "Recent M1 preview:"
          head -n 3 download/usdjpy_recent_m1_full.csv
          test -s download/usdjpy_recent_m1_full.csv

      - name: Build long midpoint H1 and anomaly research dataset
        shell: bash
        run: |
          python scripts/merge_long_data.py \
            --full-file download/usdjpy_h1_full.csv \
            --m1-file download/usdjpy_recent_m1_full.csv \
            --output data/usdjpy_h1.csv \
            --meta data/meta.json \
            --reset-existing
          python scripts/analyze_anomaly.py \
            --input data/usdjpy_h1.csv \
            --output data/anomaly_research.json \
            --detail-limit 120
          python -m py_compile scripts/merge_data.py scripts/merge_long_data.py scripts/analyze_anomaly.py
          node --check app.js
          node --check detail-fix-v6.js
          node --check research.js
          python3 - <<'PY'
          import csv, json
          from datetime import datetime, timezone
          with open('data/meta.json', encoding='utf-8') as f:
              meta = json.load(f)
          assert meta['price_type'] == 'mid', meta
          assert int(meta.get('dataset_version', 0)) >= 6, meta
          assert int(meta.get('rolling_days', 0)) >= 3000, meta
          assert meta['bars'] >= 40000, meta
          assert int(meta.get('m1_rows_loaded_this_run', 0)) > 0, meta
          sep1 = int(datetime(2026, 9, 1, tzinfo=timezone.utc).timestamp() * 1000)
          assert int(meta['last_timestamp']) >= sep1, meta
          with open('data/usdjpy_h1.csv', newline='', encoding='utf-8') as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == meta['bars']
          with open('data/anomaly_research.json', encoding='utf-8') as f:
              research = json.load(f)
          assert len(research.get('strategy_summaries', [])) >= 500, len(research.get('strategy_summaries', []))
          assert len(research.get('strategy_details', [])) >= 100, len(research.get('strategy_details', []))
          assert len(research.get('data', {}).get('years', [])) >= 8, research.get('data')
          september = [r for r in rows if int(float(r['timestamp'])) >= sep1]
          assert september, 'September rows missing'
          assert all(float(r['open']) > 0 for r in september), 'invalid September mid open'
          print('validated midpoint bars:', len(rows), 'years:', research['data']['years'], 'strategies:', len(research['strategy_summaries']), 'last:', meta['last_utc'])
          PY
          wc -l data/usdjpy_h1.csv
          ls -lh data/anomaly_research.json
          cat data/meta.json

      - name: Commit refreshed research data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/usdjpy_h1.csv data/meta.json data/anomaly_research.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh USDJPY long-history anomaly research"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html research.html styles.css chart-html.css app.js detail-fix-v6.js research.js _site/
          cp -R data _site/data
          touch _site/.nojekyll

      - name: Check or enable GitHub Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          headers=(-H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28")
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" "${headers[@]}" "$api")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          create_code=$(curl -sS -o /tmp/pages-create.json -w "%{http_code}" -X POST \
            "${headers[@]}" -H "Content-Type: application/json" \
            -d '{"build_type":"workflow"}' "$api")
          if [ "$create_code" = "201" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi

      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
